services:
  - type: web
    name: nagrik-ai
    runtime: python
    plan: starter            # persistent disk needs a paid plan; "free" works but data resets on redeploy
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false          # paste your NEW key in the Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATA_DIR
        value: /var/data
    disk:
      name: nagrik-data
      mountPath: /var/data
      sizeGB: 1
