<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPKAR – Message checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>NAGRIK AI </h1>
      <p class="lede">Check whether a Hindi or English message is suitable for a public civic discussion.</p>
    </header>

    <section class="entry">
      <label for="message">Message</label>
      <textarea id="message" rows="6" maxlength="{{ max_chars }}"
        placeholder="Type or paste a message in Hindi or English"></textarea>
      <div class="entry-foot">
        <span id="count" class="muted">0 / {{ max_chars }}</span>
        <button id="check" type="button">Check message</button>
      </div>
    </section>

    <section id="result" class="result" hidden aria-live="polite">
      <h2 id="verdict"></h2>
      <div class="meter" id="meter-wrap"><div class="meter-fill" id="meter"></div></div>
      <p id="detail" class="muted"></p>
    </section>

    <section class="examples">
      <p class="muted">Try an example</p>
      <button type="button" class="chip" data-text="The new road project will really help our village.">English</button>
      <button type="button" class="chip" data-text="सड़क की मरम्मत जल्दी होनी चाहिए">हिन्दी</button>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
